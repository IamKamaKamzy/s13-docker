name: Docker build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            s13-training-camps:${{ github.sha }}
            s13-training-camps:latest

      - name: Show built image
        run: |
          docker image ls --no-trunc --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' s13-training-camps
          {
            echo '## Built Docker image'
            echo
            echo '| Tag | Image ID | Size |'
            echo '|---|---|---|'
            docker image inspect "s13-training-camps:${GITHUB_SHA}" --format '| `{{.RepoTags}}` | `{{.Id}}` | {{.Size}} bytes |'
          } >> "$GITHUB_STEP_SUMMARY"

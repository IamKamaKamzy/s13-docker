name: Docker build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: iamkamakamzy
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            iamkamakamzy/automation:${{ github.sha }}
            iamkamakamzy/automation:latest

      - name: Show built image
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            docker pull "iamkamakamzy/automation:${GITHUB_SHA}"
          fi
          docker image ls --no-trunc --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' iamkamakamzy/automation
          {
            echo '## Docker image'
            echo
            echo '| Tag | Image ID | Digest | Size |'
            echo '|---|---|---|---|'
            docker image inspect "iamkamakamzy/automation:${GITHUB_SHA}" --format "| \`{{index .RepoTags 0}}\` | \`{{.Id}}\` | \`${{ steps.build.outputs.digest }}\` | {{.Size}} bytes |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start and verify container
        if: github.event_name != 'pull_request'
        run: |
          docker run --detach \
            --name s13-training-camps-ci \
            --publish 127.0.0.1:8080:8080 \
            "iamkamakamzy/automation:${GITHUB_SHA}"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > /tmp/health.json; then
              curl --fail --silent --show-error http://127.0.0.1:8080/api/courses > /tmp/courses.json
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs s13-training-camps-ci
              exit 1
            fi
            sleep 2
          done

          docker ps --no-trunc --filter name=s13-training-camps-ci
          docker inspect --format 'Container: {{.Name}} | Status: {{.State.Status}} | Image: {{.Config.Image}} | Ports: {{json .NetworkSettings.Ports}}' s13-training-camps-ci
          docker logs s13-training-camps-ci
          {
            echo '## Container smoke test'
            echo
            echo '- Health and courses API checks passed.'
            echo '- Container is temporary and runs only during this GitHub Actions job.'
            echo
            echo '| Container | Status | Image | Ports |'
            echo '|---|---|---|---|'
            docker inspect --format '| `{{.Name}}` | `{{.State.Status}}` | `{{.Config.Image}}` | `{{json .NetworkSettings.Ports}}` |' s13-training-camps-ci
            echo
            echo 'Health response:'
            echo '```json'
            cat /tmp/health.json
            echo
            echo '```'
            echo 'Courses API response:'
            echo '```json'
            cat /tmp/courses.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

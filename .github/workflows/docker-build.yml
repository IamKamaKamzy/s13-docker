name: Docker build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: iamkamakamzy
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            iamkamakamzy/automation:${{ github.sha }}
            iamkamakamzy/automation:latest

      - name: Show built image
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            docker pull "iamkamakamzy/automation:${GITHUB_SHA}"
          fi
          docker image ls --no-trunc --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' iamkamakamzy/automation
          {
            echo '## Docker image'
            echo
            echo '| Tag | Image ID | Digest | Size |'
            echo '|---|---|---|---|'
            docker image inspect "iamkamakamzy/automation:${GITHUB_SHA}" --format "| \`{{index .RepoTags 0}}\` | \`{{.Id}}\` | \`${{ steps.build.outputs.digest }}\` | {{.Size}} bytes |"
          } >> "$GITHUB_STEP_SUMMARY"
